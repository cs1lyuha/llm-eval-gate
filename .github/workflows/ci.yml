name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Teste unitare
        run: pytest -q
      - name: Gate de evaluare (replay din casete, fără cheie API)
        run: python -m evalgate run suites/support.json --baseline baselines/support-replies.json
